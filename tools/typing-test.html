<header class="tools-head tool-page-head">
<div class="tools-wrap">
<a class="tools-back" href="./">← All tools</a>
<h1>Typing practice</h1>
<p>Test your typing speed and accuracy in English or romanized Nepali.</p>
</div>
</header>
<main class="tools-wrap tool-main">
<div class="tool-panel">
<div class="tt-controls">
<div class="tt-control"><label class="tool-label" for="tt-language">Text</label><select class="tool-input" id="tt-language"><option value="paragraph">Random paragraph</option><option value="english">English words</option><option value="nepali">Nepali words (romanized)</option><option value="nepali-paragraph">Nepali paragraph (romanized)</option></select></div>
<div class="tt-control"><label class="tool-label" for="tt-seconds">Time</label><select class="tool-input" id="tt-seconds"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="60">1 minute</option><option value="120">2 minutes</option></select></div>
<p class="tt-stat"><span class="stat-value" id="tt-time">30</span><span class="stat-label">Seconds left</span></p>
<p class="tt-stat"><span class="stat-value" id="tt-live">0</span><span class="stat-label">WPM</span></p>
</div>
<div class="tt-words" id="tt-words" aria-label="Words to type"></div>
<label class="tool-label" for="tt-input">Type here. Press space after each word. The timer starts when you begin.</label>
<input class="tool-input tt-input" id="tt-input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
<div class="tt-keyboard" id="tt-keyboard" aria-hidden="true"></div>
<button class="tool-btn tool-btn-quiet" id="tt-restart" type="button">New text</button>
</div>
<div class="stat-grid" id="tt-results" role="status" hidden></div>
<p class="tool-credit">WPM counts correctly typed letters, with 5 letters as one word. Your best scores are saved only in this browser.</p>
</main>
